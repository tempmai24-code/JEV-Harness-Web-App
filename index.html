    <script>
      // Ignore benign WebSocket/HMR transport errors in iframe preview environments
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          (e.reason.message?.includes?.('WebSocket') ||
           e.reason.message?.includes?.('ModuleRunner') ||
           String(e.reason).includes('WebSocket') ||
           e.reason?.stack?.includes?.('createWebSocketModuleRunnerTransport'))
        ) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (
          e.message?.includes?.('WebSocket') ||
          e.filename?.includes?.('@vite/client') ||
          e.error?.stack?.includes?.('createWebSocketModuleRunnerTransport')
        ) {
          e.preventDefault();
        }
      });
    </script>
  </head>
